dns:
  enable: true
  listen: ':53'
  enhanced-mode: 'fake-ip'
  fake-ip-range: '198.18.0.1/16'
  fake-ip-range6: 'fdfe:dcba:9876::1/64'
  fake-ip-filter-mode: 'blacklist'
  prefer-h3: true
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  ipv6: false
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.market.xiaomi.com'
    - 'localhost.ptlogin2.qq.com'
    - '*.msftncsi.com'
    - 'www.msmsftconnecttest.com'
    - 'internal.corp'
    - 'localhost'
  default-nameserver:
    - '223.5.5.5'
    - '119.29.29.29'
  nameserver:
    - 'https://223.5.5.5/dns-query'
    - 'https://120.53.53.53/dns-query'
  direct-nameserver-follow-policy: false
  fallback-filter:
    geoip: true
    geoip-code: 'CN'
    ipcidr:
      - '240.0.0.0/4'
      - '0.0.0.0/32'
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'
  fallback: []
  proxy-server-nameserver:
    - 'https://223.5.5.5/dns-query'
    - 'https://120.53.53.53/dns-query'
  direct-nameserver:
    - 'https://223.5.5.5/dns-query'
    - 'https://120.53.53.53/dns-query'
  nameserver-policy:
    geosite:cn,private:
      - 'https://223.5.5.5/dns-query'
      - 'https://120.53.53.53/dns-query'
    geosite:geolocation-!cn:
      - 'https://1.1.1.1/dns-query#PROXY'
      - 'https://8.8.8.8/dns-query#PROXY'
